<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Veinte afirmaciones para situarte en un mapa político de dos ejes y comparar tus respuestas con los programas del 29N. Todo se calcula en tu navegador.">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E293B'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M16 8 L18.4 16 L16 24 L13.6 16 Z' fill='white'/%3E%3Cpath d='M16 8 L18.4 16 L13.6 16 Z' fill='%23F59E0B'/%3E%3C/svg%3E">
<title>Brújula 29N · Test político con los programas del 29N</title>
<style>
/* =====================================================================
   Brújula 29N · v1.2
   Identidad: pizarra corporativa + acento ocre. Ningún color de partido.
   Tipografía del sistema (SF Pro / Segoe / Roboto): cero peticiones externas.
   ===================================================================== */
:root{
  --fondo:#F5F6F8; --sup:#FFFFFF; --sup2:#F8FAFC; --tinta:#0F172A; --tinta2:#475569; --tinta3:#64748B;
  --linea:#E2E8F0; --linea2:#CBD5E1; --pizarra:#1E293B; --pizarra2:#334155; --sobre:#FFFFFF;
  --zona:#EEF1F5; --zona2:#E2E7EE; --previo:#7C8796;
  --ocre:#B45309; --ocre-v:#F59E0B; --ocre-fondo:#FEF3E2;
  --sombra:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06);
  --sombra2:0 2px 4px rgba(15,23,42,.06),0 12px 32px rgba(15,23,42,.10);
  --r1:10px; --r2:16px; --r3:24px;
  --fuente:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fuente-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#0B1120; --sup:#131C2E; --sup2:#162135; --tinta:#E2E8F0; --tinta2:#94A3B8; --tinta3:#94A3B8;
    --linea:#1F2A3E; --linea2:#334155; --pizarra:#E2E8F0; --pizarra2:#CBD5E1; --sobre:#0B1120;
    --zona:#18233A; --zona2:#202D47; --previo:#8592A6; --ocre:#F59E0B; --ocre-v:#F59E0B; --ocre-fondo:#2A2113;
    --sombra:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --sombra2:0 12px 32px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --fondo:#0B1120; --sup:#131C2E; --sup2:#162135; --tinta:#E2E8F0; --tinta2:#94A3B8; --tinta3:#94A3B8;
  --linea:#1F2A3E; --linea2:#334155; --pizarra:#E2E8F0; --pizarra2:#CBD5E1; --sobre:#0B1120;
  --zona:#18233A; --zona2:#202D47; --previo:#8592A6; --ocre:#F59E0B; --ocre-v:#F59E0B; --ocre-fondo:#2A2113;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --sombra2:0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-padding-top:80px;scroll-padding-bottom:110px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.55 var(--fuente);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--ocre-v);outline-offset:2px;border-radius:8px}
main:focus,main:focus-visible{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cont{max-width:1080px;margin:0 auto;padding:0 20px}
.estrecho{max-width:720px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Cabecera ---------- */
.cab{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--fondo) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--linea)}
.cab .cont{display:flex;align-items:center;gap:8px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;cursor:pointer;color:var(--tinta);font:700 18px/1 var(--fuente-d);letter-spacing:-.2px;margin-right:auto}
.logo svg{width:32px;height:32px}
.logo span{text-align:left}
.logo small{display:block;font:500 12px/1.2 var(--fuente);color:var(--tinta3);letter-spacing:0;margin-top:3px}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;color:var(--tinta2);font:600 14px/1 var(--fuente);padding:0 12px;min-height:40px;border-radius:999px;cursor:pointer}
.nav button:hover{background:var(--zona);color:var(--tinta)}
.nav button[aria-current="page"]{color:var(--tinta);background:var(--zona)}
.icono{width:40px;height:40px;border-radius:999px;border:1px solid var(--linea);background:var(--sup);color:var(--tinta);display:grid;place-items:center;cursor:pointer}
@media (max-width:640px){.nav .solo-ancho{display:none}.logo small{display:none}}

main.cont{outline:none;padding:32px 20px 140px;min-height:70vh}

/* ---------- Tipografía ---------- */
h1,h2,h3{font-family:var(--fuente-d);color:var(--tinta);letter-spacing:-.02em}
h1{font-size:clamp(34px,5.4vw,56px);line-height:1.05;font-weight:800;margin:0 0 18px}
h2{font-size:clamp(22px,2.6vw,28px);line-height:1.2;font-weight:750;margin:0 0 12px}
h3{font-size:18px;line-height:1.3;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 14px}
.lead{font-size:clamp(17px,1.8vw,20px);line-height:1.6;color:var(--tinta2);max-width:36em}
.t2{color:var(--tinta2)} .t3{color:var(--tinta3)}
.peq{font-size:14px;line-height:1.55}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--fuente);color:var(--tinta2);background:var(--sup);border:1px solid var(--linea);border-radius:999px;padding:7px 12px}
.chip .pto{width:7px;height:7px;border-radius:50%;background:var(--ocre-v)}

/* ---------- Botones ---------- */
.btn{font:650 16px/1 var(--fuente);min-height:52px;padding:0 24px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border:1px solid transparent;transition:transform .12s var(--ease),background .15s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn-1{background:var(--pizarra);color:var(--sobre);box-shadow:0 6px 16px rgba(15,23,42,.18)}
.btn-1:hover{background:var(--pizarra2)}
.btn-2{background:var(--sup);color:var(--tinta);border-color:var(--linea2)}
.btn-2:hover{border-color:var(--tinta3)}
.btn-txt{background:none;border:0;color:var(--tinta);font:600 15px/1.2 var(--fuente);min-height:44px;padding:8px 4px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-txt:hover{text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:linear-gradient(to top,var(--fondo) 65%,transparent);padding:24px 0 calc(14px + env(safe-area-inset-bottom))}
.dock .cont{display:flex;gap:10px;justify-content:center}
.dock .btn{flex:1;max-width:520px}
@media (min-width:900px){.dock.solo-movil{display:none}}

/* ---------- Tarjetas ---------- */
.card{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r3);box-shadow:var(--sombra)}
.card-pad{padding:clamp(20px,3vw,32px)}

/* ---------- Portada ---------- */
.hero{display:grid;gap:40px;align-items:center;grid-template-columns:1fr}
@media (min-width:900px){.hero{grid-template-columns:1.1fr .9fr;gap:56px;padding-top:24px}}
.hero .chip{margin-bottom:22px}
.hero-acc{display:none;gap:12px;margin-top:28px}
@media (min-width:900px){.hero-acc{display:flex}}
.hero-visual{position:relative}
.hero-visual .card{padding:18px}
.hero-visual .nota-v{position:absolute;right:-12px;top:-14px;background:var(--sup);border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra2);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
@media (max-width:899px){.hero-visual{max-width:420px;width:100%;margin:0 auto}.hero-visual .nota-v{right:8px}}
.rasgos{display:grid;gap:14px;grid-template-columns:1fr;margin:48px 0 0}
@media (min-width:720px){.rasgos{grid-template-columns:repeat(3,1fr)}}
.rasgo{display:flex;gap:14px;align-items:flex-start;padding:20px}
.rasgo .ico{width:40px;height:40px;border-radius:12px;background:var(--zona);display:grid;place-items:center;color:var(--tinta);flex:none}
.rasgo h3{font-size:16px;margin:2px 0 4px}
.rasgo p{font-size:14px;color:var(--tinta2);margin:0}
.programas-lista{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pie{border-top:1px solid var(--linea);margin-top:56px;padding:28px 0 8px;display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;font-size:13px;color:var(--tinta3)}
.pie a{color:var(--tinta2)}

/* ---------- Test ---------- */
.test{padding:clamp(22px,4vw,40px)}
.test-cab{display:flex;justify-content:space-between;align-items:center;gap:12px}
.barra{height:6px;background:var(--zona);border-radius:999px;overflow:hidden;margin:16px 0 0}
.barra>div{height:100%;background:var(--pizarra);border-radius:999px;transition:width .35s var(--ease)}
.enunciado{font-family:var(--fuente-d);font-size:clamp(24px,3.6vw,34px);line-height:1.25;font-weight:700;letter-spacing:-.02em;margin:36px 0 0;min-height:4.6em}
.enunciado.entra{animation:entra .3s var(--ease)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.escala{margin-top:24px}
.puntos{display:grid;grid-template-columns:repeat(5,1fr);align-items:start;gap:4px}
.punto{border:0;background:none;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;border-radius:14px;color:var(--tinta2);font:600 13px/1.25 var(--fuente);text-align:center;min-height:44px}
.punto .c{display:grid;place-items:center;border-radius:50%;border:2px solid var(--linea2);background:var(--sup);transition:transform .15s var(--ease),background .15s,border-color .15s}
.punto[data-i="0"] .c,.punto[data-i="4"] .c{width:56px;height:56px}
.punto[data-i="1"] .c,.punto[data-i="3"] .c{width:46px;height:46px}
.punto[data-i="2"] .c{width:36px;height:36px;border-style:dashed}
.punto:hover .c{border-color:var(--pizarra);transform:scale(1.05)}
.punto[aria-pressed="true"] .c{background:var(--pizarra);border-color:var(--pizarra);border-style:solid}
.punto[aria-pressed="true"] .c::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sobre)}
.punto[aria-pressed="true"]{color:var(--tinta)}
.punto .lb{max-width:11ch}
@media (max-width:560px){.punto .lb{display:none}.punto[data-i="0"] .lb,.punto[data-i="4"] .lb{display:block}}
.eleccion{text-align:center;min-height:24px;margin-top:16px;font-weight:650}
@media (min-width:561px){.eleccion{display:none}}
.test-pie{display:flex;justify-content:space-between;align-items:center;margin-top:24px;border-top:1px solid var(--linea);padding-top:12px}
.atajo{display:none;font-size:13px;color:var(--tinta3)}
.atajo kbd{font:600 12px var(--fuente);border:1px solid var(--linea2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--sup2)}
@media (hover:hover) and (pointer:fine){.atajo{display:block}}

/* ---------- Resultado ---------- */
.res-cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.res-cab h1{margin:0;font-size:clamp(30px,4.4vw,44px)}
.acc-ancho{display:none;gap:10px}
@media (min-width:900px){.acc-ancho{display:flex}}
.tabs{position:sticky;top:64px;z-index:10;background:var(--fondo);padding:8px 0 12px;margin-bottom:8px}
.seg{display:inline-grid;grid-template-columns:repeat(3,auto);background:var(--zona);border-radius:999px;padding:4px;width:100%;max-width:520px}
.seg button{min-height:42px;border:0;border-radius:999px;background:none;color:var(--tinta2);font:650 14px/1.1 var(--fuente);cursor:pointer;padding:0 14px}
.seg button[aria-selected="true"]{background:var(--sup);color:var(--tinta);box-shadow:0 1px 3px rgba(15,23,42,.14)}
.rejilla{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:900px){.rejilla{grid-template-columns:1.05fr .95fr;align-items:start}}
.mapa{padding:14px 10px 6px}
.grafico{width:100%;max-width:520px;display:block;margin:0 auto}
.grafico text{font-family:var(--fuente);fill:var(--tinta)}
.grafico .rot{font-family:var(--fuente-d);font-size:14px;font-weight:700}
.grafico .sub{font-size:10px;fill:var(--tinta3)}
.grafico .tick{font-size:9px;fill:var(--tinta3)}
#yo{transition:transform 1.1s var(--ease)}
@media (prefers-reduced-motion: reduce){#yo{transition:none}.enunciado.entra{animation:none}.barra>div{transition:none}}
.mapa-pie{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--tinta3);padding:6px 10px 10px}
.mapa-pie span{display:inline-flex;align-items:center;gap:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.kpi{padding:18px 18px 16px}
.kpi .k{font:600 13px/1 var(--fuente);color:var(--tinta3)}
.kpi .v{font:750 40px/1.05 var(--fuente-d);letter-spacing:-.03em;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:14px;font-weight:650}
.kpi .eje{position:relative;height:8px;border-radius:999px;background:var(--zona);margin-top:14px}
.kpi .eje::before{content:"";position:absolute;left:40%;width:20%;top:0;bottom:0;background:var(--zona2)}
.kpi .eje i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--pizarra);border:2px solid var(--sup);transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.kpi .ext{display:flex;justify-content:space-between;font-size:11px;color:var(--tinta3);margin-top:6px}
.perfil p{font-size:16px;line-height:1.65}
.perfil .destacado{font:700 19px/1.4 var(--fuente-d);letter-spacing:-.01em;color:var(--tinta)}
.bloque{padding:22px}
.bloque+.bloque{margin-top:16px}

/* ---------- Programas ---------- */
.avisos{display:grid;gap:12px;margin-bottom:16px}
@media (min-width:900px){.avisos{grid-template-columns:1fr 1fr}}
.aviso{background:var(--ocre-fondo);border:1px solid color-mix(in srgb,var(--ocre) 30%,transparent);border-radius:var(--r2);padding:16px 18px;display:flex;gap:12px}
.aviso .ic{color:var(--ocre);margin-top:2px}
.aviso strong{display:block;margin-bottom:4px;color:var(--tinta)}
.aviso ul{margin:6px 0 0;padding-left:18px}
.leyenda{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--tinta2);margin:4px 0 14px}
.leyenda span{display:inline-flex;align-items:center;gap:7px}
.progs{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){.progs{grid-template-columns:1fr 1fr}}
.prog{padding:20px}
.prog-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.prog-cab h3{margin:0;font-size:20px}
.ini{width:40px;height:40px;border-radius:12px;background:var(--zona);display:grid;place-items:center;font:750 14px/1 var(--fuente-d);color:var(--tinta);flex:none}
.prog-nombre{display:flex;align-items:center;gap:12px}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cifra{background:var(--sup2);border:1px solid var(--linea);border-radius:12px;padding:10px 12px}
.cifra b{display:block;font:750 24px/1.1 var(--fuente-d);font-variant-numeric:tabular-nums}
.cifra span{font-size:12px;color:var(--tinta3)}
.tira{display:grid;grid-template-columns:repeat(10,1fr) 8px repeat(10,1fr);gap:3px;align-items:center}
.tira i,.ley{display:block;height:24px;border-radius:5px}
.ley{width:14px;height:14px;border-radius:4px}
.c-coincide{background:var(--pizarra)}
.c-discrepa{background:var(--sup);box-shadow:inset 0 0 0 2px var(--pizarra)}
.c-sin{background:repeating-linear-gradient(135deg,var(--zona2) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--linea2)}
.c-neutral{background:var(--zona)}
.c-doble{box-shadow:inset 0 0 0 2px var(--pizarra),0 0 0 2px var(--ocre-v)}
.c-coincide.c-doble{box-shadow:0 0 0 2px var(--ocre-v)}
.tira-rot{display:grid;grid-template-columns:1fr 8px 1fr;font-size:12px;color:var(--tinta3);margin-top:6px}
.prog details{margin-top:12px;border-top:1px solid var(--linea);padding-top:4px}
.prog summary{cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:650;font-size:15px;list-style:none}
.prog summary::-webkit-details-marker{display:none}
.prog summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--tinta2);border-bottom:2px solid var(--tinta2);transform:rotate(45deg);margin-right:4px;transition:transform .2s}
.prog details[open] summary::after{transform:rotate(-135deg)}
.prog dl{margin:4px 0 0;font-size:14px}
.prog dt{font-weight:650;margin-top:8px}
.prog dd{margin:2px 0 0;color:var(--tinta2)}
.pond{font-size:13px;color:var(--tinta3);margin:10px 0 0}

/* ---------- Afirmaciones ---------- */
.filtro{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.filtro button{min-height:40px;border-radius:999px;padding:0 16px;border:1px solid var(--linea2);background:var(--sup);color:var(--tinta);font:600 14px/1 var(--fuente);cursor:pointer}
.filtro button[aria-pressed="true"]{border-color:var(--pizarra);background:var(--pizarra);color:var(--sobre)}
.afs{display:grid;gap:12px}
details.af{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r2);box-shadow:var(--sombra)}
details.af>summary{list-style:none;cursor:pointer;padding:18px 20px}
details.af>summary::-webkit-details-marker{display:none}
details.af[open]>summary{border-bottom:1px solid var(--linea)}
.af-tema{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--tinta3);font-weight:600}
.af-texto{font:700 18px/1.35 var(--fuente-d);letter-spacing:-.01em;margin:6px 0 10px}
.af-resp{font-size:14px;color:var(--tinta2);margin-bottom:10px}
.af-resp strong{color:var(--tinta)}
.marcas{display:flex;flex-wrap:wrap;gap:6px}
.m{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:4px 11px 4px 5px;border:1px solid var(--linea2);background:var(--sup)}
.m b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px}
.m.coincide{border-color:var(--pizarra)} .m.coincide b{background:var(--pizarra);color:var(--sobre)}
.m.discrepa{border-color:var(--pizarra)} .m.discrepa b{box-shadow:inset 0 0 0 1.5px var(--pizarra)}
.m.otro{color:var(--tinta3);border-style:dashed}
.af-cuerpo{padding:6px 20px 20px;display:grid;gap:12px}
@media (min-width:900px){.af-cuerpo{grid-template-columns:1fr 1fr}}
.cita{background:var(--sup2);border:1px solid var(--linea);border-radius:12px;padding:14px}
.cita-cab{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.cita .quien{font-weight:700}
.cita .post{font-size:13px;color:var(--tinta2)}
.cita q{display:block;font-size:15px;line-height:1.5;margin:6px 0;color:var(--tinta)}
.etq{font-size:11px;font-weight:650;border-radius:6px;padding:2px 7px;background:var(--zona);color:var(--tinta2)}
.corr{grid-column:1/-1;font-size:14px}

.cierre{text-align:center;margin:48px auto 6px;max-width:560px}
.cierre strong{display:block;font:750 24px/1.25 var(--fuente-d);letter-spacing:-.02em;margin-bottom:6px}

<script>
"use strict";
/* ================= CORE (lógica pura, probada aparte) ================= */
/* CORE-START */
function puntuar(preguntas, resp){
  // Cada respuesta vale de -2 a +2 y se multiplica por la dirección (+1/-1). La suma de cada eje se divide entre 2: escala -10..+10.
  var ejes={economico:0,social:0};
  preguntas.forEach(function(q){var v=resp[q.id]; if(typeof v==="number") ejes[q.eje]+=v*q.direccion;});
  return {economico:ejes.economico/2, social:ejes.social/2};
}
function categoria(v){var a=Math.abs(v); if(a<=2) return "centro"; if(a<=5) return "moderada"; if(a<=8) return "clara"; return "muy marcada";}
function estadoPostura(s, v){
  if(s.tipo==="mixta") return "mixta";
  if(s.valor===0) return "sin_postura";
  if(!v) return "neutral";
  return Math.sign(v)===s.valor ? "coincide" : "discrepa";
}
function cotejo(preguntas, partidos, resp){
  // Peso implícito: las respuestas firmes («muy de acuerdo» / «muy en desacuerdo») cuentan el doble.
  var res={};
  partidos.forEach(function(p){res[p.id]={coincide:0,discrepa:0,sinPostura:0,neutral:0,coincidePeso:0,discrepaPeso:0,detalle:[]};});
  preguntas.forEach(function(q){
    var v=resp[q.id], peso=Math.abs(v)===2?2:1;
    partidos.forEach(function(p){
      var e=estadoPostura(q.posturas[p.id], v), r=res[p.id];
      if(e==="coincide"){r.coincide++; r.coincidePeso+=peso;}
      else if(e==="discrepa"){r.discrepa++; r.discrepaPeso+=peso;}
      else if(e==="neutral"){r.neutral++;}
      else {r.sinPostura++;}
      r.detalle.push({id:q.id,estado:e,peso:peso});
    });
  });
  return res;
}
function avisosGrado(preguntas, partidos, resp){
  var out=[];
  preguntas.forEach(function(q){
    var v=resp[q.id]; if(Math.abs(v)!==1) return;
    partidos.forEach(function(p){var s=q.posturas[p.id];
      if(s.intensidad==="alta" && estadoPostura(s,v)==="coincide") out.push({q:q,p:p,s:s});});
  });
  return out;
}
function avisosSinPostura(preguntas, partidos, umbral){
  var out=[];
  partidos.forEach(function(p){var n=preguntas.filter(function(q){return q.posturas[p.id].valor===0;}).length; if(n>=umbral) out.push({p:p,n:n});});
  return out;
}
function contarCambios(prev, act){var n=0; Object.keys(act).forEach(function(k){if(prev[k]!==act[k]) n++;}); return n;}
function ordenIntercalado(preguntas){
  // Alterna economía y sociedad para que el test no se perciba por bloques.
  var e=preguntas.filter(function(q){return q.eje==="economico";}), s=preguntas.filter(function(q){return q.eje==="social";}), o=[];
  for(var i=0;i<Math.max(e.length,s.length);i++){ if(e[i]) o.push(e[i]); if(s[i]) o.push(s[i]); }
  return o;
}
/* CORE-END */

/* ================= Iconos ================= */
var IC={
  candado:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',

};

/* ================= Estado y almacenamiento ================= */
var CLAVE="brujula29n:v1", CLAVE_TEMA="brujula29n:tema";
var DATOS=null, ESCALA=null, ORDEN=[];
var est={vista:"inicio", i:0, resp:{}, tandaId:null, pestana:"posicion", filtro:"todas", animar:false};
function hoyISO(){return new Date().toISOString();}
function uuid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(16).slice(2);}
function leer(){try{var r=JSON.parse(localStorage.getItem(CLAVE)); if(r&&Array.isArray(r.tandas)) return r;}catch(e){} return {version:1,actualizado:hoyISO(),tandas:[]};}
function guardar(db){try{db.actualizado=hoyISO(); localStorage.setItem(CLAVE,JSON.stringify(db)); return true;}catch(e){toast("Este navegador no permite guardar. Verás el resultado igualmente, pero no quedará en el historial."); return false;}}
function tandasActivas(){return leer().tandas.filter(function(t){return !t.borrado;});}

/* ================= Utilidades ================= */
var $app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function num(v){var s=Math.abs(v).toLocaleString("es-ES",{minimumFractionDigits:1,maximumFractionDigits:1}); return (v>0?"+":v<0?"−":"")+s;}
function fecha(iso){try{return new Date(iso).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"});}catch(e){return iso;}}
function pregunta(id){return DATOS.preguntas.filter(function(q){return q.id===id;})[0];}
function partidos(){return DATOS.partidos.slice().sort(function(a,b){return a.nombre.localeCompare(b.nombre,"es");});}
function iniciales(n){var w=n.split(/\s+/); return (w.length>1?w[0][0]+w[1][0]:n.slice(0,2)).toUpperCase();}
function textoRespuesta(v){return ESCALA.opciones[ESCALA.valores.indexOf(v)]||"Sin responder";}
function listaY(arr){if(arr.length<2) return arr.join(""); return arr.slice(0,-1).join(", ")+" y "+arr[arr.length-1];}
function minus(s){return s.charAt(0).toLowerCase()+s.slice(1);}
var toastT=null;
function toast(msg, accion, fn){
  var t=document.getElementById("toast"); t.textContent=msg;
  if(accion){var b=document.createElement("button"); b.type="button"; b.textContent=accion; b.onclick=function(){t.style.display="none"; fn();}; t.appendChild(b);}
  t.style.display="flex"; clearTimeout(toastT); toastT=setTimeout(function(){t.style.display="none";},5000);
}
function irA(vista){est.vista=vista; render(); $app.focus({preventScroll:true}); window.scrollTo(0,0);}
function enlazar(sel, fn){Array.prototype.forEach.call(document.querySelectorAll(sel), fn);}
var NOMBRE_ESTADO={coincide:"coincide",discrepa:"discrepa",sin_postura:"sin postura",mixta:"medidas en ambos sentidos",neutral:"no cuenta: respuesta neutral"};
var CLASE_TIRA={coincide:"c-coincide",discrepa:"c-discrepa",sin_postura:"c-sin",mixta:"c-sin",neutral:"c-neutral"};

/* ================= Gráfico ================= */
function svgGrafico(actual, previo, animar, sufijo, demo){
  sufijo=sufijo||"";
  var W=380, m=50, s=W-2*m, c=W/2, k=s/20;
  function X(v){return c+v*k;} function Y(v){return c-v*k;}
  function cl(v){return Math.max(-10,Math.min(10,v));}
  var g='<svg class="grafico" viewBox="0 0 '+W+' '+W+'" role="img" aria-labelledby="gT'+sufijo+' gD'+sufijo+'" xmlns="http://www.w3.org/2000/svg">';
  g+='<title id="gT'+sufijo+'">'+(demo?'Mapa político de dos ejes':'Tu posición en el mapa político')+'</title><desc id="gD'+sufijo+'">'+(demo?'Eje vertical de intervencionista a liberal en economía; eje horizontal de progresista a conservador en lo social.':'Economía '+num(actual.economico)+', de intervencionista (−10) a liberal (+10). Sociedad '+num(actual.social)+', de progresista (−10) a conservador (+10).'+(previo?' Resultado anterior: economía '+num(previo.economico)+', sociedad '+num(previo.social)+'.':''))+'</desc>';
  g+='<defs><clipPath id="cp'+sufijo+'"><rect x="'+m+'" y="'+m+'" width="'+s+'" height="'+s+'" rx="10"/></clipPath></defs>';
  g+='<g clip-path="url(#cp'+sufijo+')"><rect x="'+m+'" y="'+m+'" width="'+s+'" height="'+s+'" fill="var(--sup2)"/>';
  for(var t=-10;t<=10;t+=2.5){ g+='<line x1="'+X(t)+'" y1="'+m+'" x2="'+X(t)+'" y2="'+(m+s)+'" stroke="var(--linea)" stroke-width="'+(t%5===0?1:.6)+'"/><line x1="'+m+'" y1="'+Y(t)+'" x2="'+(m+s)+'" y2="'+Y(t)+'" stroke="var(--linea)" stroke-width="'+(t%5===0?1:.6)+'"/>'; }
  g+='<rect x="'+X(-2)+'" y="'+m+'" width="'+(4*k)+'" height="'+s+'" fill="var(--zona)" opacity=".9"/><rect x="'+m+'" y="'+Y(2)+'" width="'+s+'" height="'+(4*k)+'" fill="var(--zona)" opacity=".9"/><rect x="'+X(-2)+'" y="'+Y(2)+'" width="'+(4*k)+'" height="'+(4*k)+'" fill="var(--zona2)"/></g>';
  g+='<rect x="'+m+'" y="'+m+'" width="'+s+'" height="'+s+'" rx="10" fill="none" stroke="var(--linea2)"/>';
  g+='<line x1="'+c+'" y1="'+m+'" x2="'+c+'" y2="'+(m+s)+'" stroke="var(--tinta3)" stroke-width="1.2"/><line x1="'+m+'" y1="'+c+'" x2="'+(m+s)+'" y2="'+c+'" stroke="var(--tinta3)" stroke-width="1.2"/>';
  for(var u=-9;u<=9;u++){ if(u===0) continue; var L=(u%5===0)?4.5:2.2;
    g+='<line x1="'+X(u)+'" y1="'+(c-L)+'" x2="'+X(u)+'" y2="'+(c+L)+'" stroke="var(--tinta3)" stroke-width=".8"/><line x1="'+(c-L)+'" y1="'+Y(u)+'" x2="'+(c+L)+'" y2="'+Y(u)+'" stroke="var(--tinta3)" stroke-width=".8"/>'; }
  [-5,5].forEach(function(t){ g+='<text class="tick" x="'+X(t)+'" y="'+(c+15)+'" text-anchor="middle">'+t+'</text><text class="tick" x="'+(c+7)+'" y="'+(Y(t)+3)+'">'+t+'</text>'; });
  g+='<text class="rot" x="'+c+'" y="'+(m-22)+'" text-anchor="middle">Liberal</text><text class="sub" x="'+c+'" y="'+(m-9)+'" text-anchor="middle">en economía</text>';
  g+='<text class="rot" x="'+c+'" y="'+(m+s+21)+'" text-anchor="middle">Intervencionista</text><text class="sub" x="'+c+'" y="'+(m+s+34)+'" text-anchor="middle">en economía</text>';
  g+='<text class="rot" x="'+(m-14)+'" y="'+c+'" text-anchor="middle" transform="rotate(-90 '+(m-14)+' '+c+')">Progresista</text>';
  g+='<text class="rot" x="'+(m+s+16)+'" y="'+c+'" text-anchor="middle" transform="rotate(90 '+(m+s+16)+' '+c+')">Conservador</text>';
  if(demo){ g+='<circle cx="'+c+'" cy="'+c+'" r="22" fill="none" stroke="var(--tinta3)" stroke-dasharray="4 4"/><text x="'+c+'" y="'+(c+6)+'" text-anchor="middle" font-size="18" font-weight="800">?</text></svg>'; return g; }
  if(previo){
    var px=X(cl(previo.social)), py=Y(cl(previo.economico));
    g+='<circle cx="'+px+'" cy="'+py+'" r="8" fill="var(--sup)" stroke="var(--previo)" stroke-width="2" stroke-dasharray="3 2.5"/>';
    g+='<text x="'+(px+(px>c?-12:12))+'" y="'+(py+19)+'" text-anchor="'+(px>c?"end":"start")+'" font-size="11" style="fill:var(--previo);paint-order:stroke;stroke:var(--sup2);stroke-width:3px">anterior</text>';
  }
  var ux=X(cl(actual.social))-c, uy=Y(cl(actual.economico))-c, der=ux>60;
  g+='<g id="yo'+sufijo+'" data-x="'+ux+'" data-y="'+uy+'" style="transform:'+(animar?'translate(0px,0px)':'translate('+ux+'px,'+uy+'px)')+'">';
  g+='<circle cx="'+c+'" cy="'+c+'" r="18" fill="var(--ocre-v)" opacity=".22"/><circle cx="'+c+'" cy="'+c+'" r="9" fill="var(--pizarra)" stroke="var(--sup)" stroke-width="3"/>';
  g+='<g transform="translate('+(c+(der?-16:16))+' '+(c-24)+')"><rect x="'+(der?-34:0)+'" y="-13" width="34" height="22" rx="11" fill="var(--pizarra)"/><text x="'+(der?-17:17)+'" y="3" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--sobre)">Tú</text></g>';
  g+='</g></svg>';
  return g;
}
function animarPunto(){var el=document.getElementById("yo"); if(!el) return; requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.transform='translate('+el.getAttribute("data-x")+'px,'+el.getAttribute("data-y")+'px)';});});}

/* ================= Comentario ================= */
function comentario(pt){
  var e=pt.economico, s=pt.social, ce=categoria(e), cs=categoria(s);
  function lado(v,neg,pos){return v>0?pos:neg;}
  var pE= ce==="centro" ? "En economía te sitúas en el centro: tus respuestas se compensan entre la intervención del Estado y el mercado." :
    "En economía tu posición es "+lado(e,"intervencionista","liberal")+" "+ce+": "+lado(e,"tiendes a confiar en el Estado para corregir el mercado y redistribuir","tiendes a confiar en el mercado y en menos impuestos y regulación")+".";
  var pS= cs==="centro" ? "En lo social te sitúas en el centro: combinas posiciones de ambos lados." :
    "En lo social tu posición es "+lado(s,"progresista","conservadora")+" "+cs+": "+lado(s,"te inclinas por ampliar derechos individuales y cambios en las normas sociales","te inclinas por preservar normas, tradiciones e identidad común")+".";
  var g;
  if(ce==="centro"&&cs==="centro") g="Quedas cerca del centro en los dos ejes.";
  else if(ce==="centro") g="Tu perfil lo define sobre todo el eje social.";
  else if(cs==="centro") g="Tu perfil lo define sobre todo el eje económico.";
  else g="Combinas una visión "+lado(e,"intervencionista","liberal")+" en economía con una visión "+lado(s,"progresista","conservadora")+" en lo social.";
  return {economico:pE, social:pS, global:g};
}
function etiquetaEje(v, neg, pos){var c=categoria(v); return c==="centro"?"Centro":(v>0?pos:neg).replace(/^./,function(x){return x.toUpperCase();})+" "+c;}
function lectura(resp){
  var neutras=DATOS.preguntas.filter(function(q){return resp[q.id]===0;});
  var firmes=ORDEN.filter(function(q){return Math.abs(resp[q.id])===2;});
  var t=[];
  if(firmes.length) t.push("Respondiste con más firmeza en "+listaY(firmes.map(function(q){return minus(q.etiqueta);}))+". Esos temas cuentan el doble al compararte con los programas.");
  else t.push("No marcaste ninguna respuesta extrema: tus posiciones son, en general, matizadas.");
  if(neutras.length) t.push("En "+neutras.length+" "+(neutras.length===1?"afirmación":"afirmaciones")+" no tomaste postura; no cuentan en las coincidencias.");
  return t;
}

function vInicio(){

  h+='<p class="peq"><strong>Test.</strong> 20 afirmaciones, 10 por eje, la mitad orientadas hacia cada polo para neutralizar el sesgo de quien tiende a asentir: si respondes «muy de acuerdo» a todo, quedas en el centro exacto. Escala de 5 grados; cada respuesta vale de −2 a +2 y se multiplica por la dirección de la afirmación. La suma de cada eje se divide entre 2 (escala de −10 a +10). Entre −2 y +2 se considera centro.</p>';
  h+='<p class="peq"><strong>Cotejo.</strong> Se leyeron completos los programas de '+progs+'. Para cada afirmación se codificó la postura de cada programa (a favor, en contra, sin postura o medidas en ambos sentidos) con una cita. Hay coincidencia cuando tu respuesta y la postura van en el mismo sentido. Las respuestas neutrales no cuentan; las firmes («muy de acuerdo» o «muy en desacuerdo») cuentan el doble.</p>';
  h+='<p class="peq"><strong>Límites.</strong> Solo se comparan '+DATOS.partidos.length+' programas. Un programa no recoge todas las posiciones de un partido y la codificación es interpretable: puede revisarse y corregirse en el repositorio público. Coincidir en la dirección no mide la intensidad de las propuestas. Los partidos no se sitúan en el mapa, a propósito. No es una encuesta ni una recomendación de voto.</p>';
  h+='<p class="peq"><strong>Privacidad.</strong> Todo se calcula en tu navegador. Ningún dato se envía a ningún servidor.</p>';
  return h;
}
function vMetodo(){
  var h='<div class="estrecho prosa"><span class="chip"><span class="pto"></span>Metodología</span><h1 style="margin-top:18px">Cómo funciona</h1><p class="lead">Una herramienta neutral para que compares tus ideas con lo que proponen los programas, no con lo que dicen los titulares.</p>';
  h+='<div class="pasos"><div class="card paso"><h3>Respondes</h3><p>20 afirmaciones sobre debates actuales, con 5 grados de acuerdo.</p></div><div class="card paso"><h3>Te situamos</h3><p>En dos ejes: economía (intervencionista o liberal) y sociedad (progresista o conservadora).</p></div><div class="card paso"><h3>Comparas</h3><p>Tema a tema, con la cita del programa que justifica cada postura.</p></div></div>';
  h+='<h2>Cómo se calcula tu posición</h2><p>Cada eje tiene 10 afirmaciones: cinco empujan hacia un polo y cinco hacia el contrario. Así se neutraliza el sesgo de quien tiende a asentir: si respondes «muy de acuerdo» a todo, quedas en el centro exacto. Cada respuesta vale de −2 a +2 según su sentido, y la suma de cada eje se divide entre 2 para obtener una escala de −10 a +10. Entre −2 y +2 se considera centro.</p>';
  h+='<h2>Cómo se codificaron los programas</h2><p>Se leyeron completos los programas de '+listaY(partidos().map(function(p){return esc(p.nombre);}))+'. Para cada afirmación y cada programa hay una postura y una cita:</p>';
  h+='<div class="tipos"><div class="card tipo"><span class="etq">Literal</span><p>El programa lo dice expresamente.</p></div><div class="card tipo"><span class="etq">Deducida</span><p>El programa no lo dice con esas palabras, pero su medida implica la postura sin necesidad de interpretar. Por ejemplo, «derogar la Ley de Vivienda» implica rechazar el tope al alquiler que esa ley permite.</p></div><div class="card tipo"><span class="etq">Mixta</span><p>Propone medidas en ambos sentidos. No cuenta ni como coincidencia ni como discrepancia.</p></div><div class="card tipo"><span class="etq">Sin postura</span><p>El programa no aborda el tema o no con claridad suficiente. Ante la duda, siempre sin postura.</p></div></div>';
  h+='<h2>Cómo se cuentan las coincidencias</h2><p>Hay coincidencia cuando tu respuesta y la postura del programa van en el mismo sentido. Las respuestas «Indiferente / no tengo una postura clara» no cuentan. Las respuestas firmes («muy de acuerdo» o «muy en desacuerdo») cuentan el doble: así pesan más los temas que más te importan, sin preguntártelo aparte.</p>';
  h+='<h2>Límites</h2><ul><li>Solo se comparan '+DATOS.partidos.length+' programas; otros partidos no están incluidos.</li><li>Un programa no recoge todas las posiciones de un partido, y la codificación es interpretable. Todas las citas son verificables y se pueden corregir en el repositorio público.</li><li>Coincidir en la dirección no mide la intensidad de las propuestas. Por eso la herramienta avisa cuando respondes de forma moderada a algo que un programa propone con máxima intensidad.</li><li>Los partidos no se sitúan en el mapa, a propósito.</li><li>No es una encuesta ni una recomendación de voto.</li></ul>';
  h+='<h2>Privacidad</h2><p>Tus respuestas revelan opiniones políticas, un dato especialmente protegido (art. 9 del RGPD). Por eso todo se calcula en tu navegador: no hay registro, ni analítica, ni cookies de seguimiento, ni fuentes o librerías externas. Lo que guardas se queda en este dispositivo y puedes borrarlo desde «Historial». El alojamiento (GitHub Pages) puede registrar datos técnicos de acceso, como la IP, según su propia política.</p>';
  h+='<h2>Independencia</h2><p>Proyecto independiente y de código abierto (licencia MIT), sin relación con ningún partido, candidatura o medio, y sin financiación.'+(DATOS.repo_url?' El código y los datos están en <a href="'+esc(DATOS.repo_url)+'" target="_blank" rel="noopener noreferrer">GitHub</a>.':'')+'</p>';
  h+='<p style="margin-top:28px"><button type="button" class="btn btn-1" data-acc="empezar">Empezar el test</button></p></div>'+pie();

/* ================= Diálogo propio ================= */
function dialogo(titulo, texto, accion, fn){
  var prev=document.activeElement, ov=document.createElement("div"); ov.className="capa"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-labelledby","dlgT");
  ov.innerHTML='<div class="hojita"><h2 id="dlgT" style="font-size:22px">'+esc(titulo)+'</h2><p class="t2">'+esc(texto)+'</p><div style="display:grid;gap:8px;margin-top:18px"><button type="button" class="btn btn-1" id="dlgOk">'+esc(accion)+'</button><button type="button" class="btn btn-2" id="dlgNo">Cancelar</button></div></div>';
  document.body.appendChild(ov); var no=ov.querySelector("#dlgNo"); no.focus();
  function cerrar(){ov.remove(); document.removeEventListener("keydown",k); if(prev&&prev.focus) prev.focus();}
  function k(e){if(e.key==="Escape") cerrar();}
  document.addEventListener("keydown",k);
  ov.addEventListener("click",function(e){if(e.target===ov) cerrar();});
  no.onclick=cerrar; ov.querySelector("#dlgOk").onclick=function(){cerrar(); fn();};
}

  else { h+='<div class="card" style="padding:6px 8px"><table><thead><tr><th scope="col">Fecha</th><th scope="col">Economía</th><th scope="col">Sociedad</th><th scope="col"><span class="sr">Abrir</span></th></tr></thead><tbody>';
    ts.slice().reverse().forEach(function(t){var p=puntuar(DATOS.preguntas,t.respuestas);
      h+='<tr><td>'+fecha(t.creado)+'</td><td>'+num(p.economico)+'</td><td>'+num(p.social)+'</td><td><button type="button" class="btn-txt" data-ver="'+t.id+'">Abrir'+IC.adelante+'</button></td></tr>';});

  h+='<button type="button" class="btn btn-2" id="bExp"'+(ts.length?'':' disabled')+'>'+IC.descarga+'Descargar copia (JSON)</button>';
  h+='<label class="btn btn-2" for="fImp">Cargar una copia</label><input type="file" id="fImp" accept="application/json,.json" class="sr"></div>';
  if(ts.length) h+='<h2 style="margin-top:36px">Borrar</h2><p class="t2">Elimina todos tus resultados de este navegador.</p><button type="button" class="btn btn-2" id="bBorrar">Borrar todo el historial</button>';
  h+='</div>'+pie();
  $app.innerHTML=h;
  enlazar('[data-acc="empezar"]',function(b){b.onclick=empezar;}); enlazarPie();

  document.getElementById("bExp").onclick=function(){
    var blob=new Blob([JSON.stringify(leer(),null,2)],{type:"application/json"}), a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="brujula29n-copia-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); a.remove(); toast("Copia descargada");};
  document.getElementById("fImp").onchange=function(e){var f=e.target.files[0]; if(!f) return; var rd=new FileReader();
    rd.onload=function(){try{var d=JSON.parse(rd.result); if(!d||!Array.isArray(d.tandas)) throw 0;
      var anterior=leer(); guardar(d); vDatos(); toast("Copia cargada: "+d.tandas.length+" resultados","Deshacer",function(){guardar(anterior); vDatos();});
    }catch(err){toast("Ese archivo no es una copia de Brújula 29N. Elige el JSON que descargaste desde aquí.");}}; rd.readAsText(f);};
  var bb=document.getElementById("bBorrar");
  if(bb) bb.onclick=function(){dialogo("¿Borrar todo el historial?","Se eliminarán de este navegador todos tus resultados guardados. No se puede deshacer.","Borrar todo el historial",function(){
    try{localStorage.removeItem(CLAVE);}catch(e){} est.tandaId=null; vDatos(); toast("Historial borrado");});};
}
